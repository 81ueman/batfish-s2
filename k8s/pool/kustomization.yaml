apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Persistent S2 pool (choice A): a long-lived controller service + worker StatefulSet that the
# Batfish engine drives per snapshot. This is separate from k8s/base (the one-shot Job runner),
# which is unchanged.
namespace: s2-pool
resources:
  - namespace.yaml
  - slices-pvc.yaml
  - controller.yaml
  - worker.yaml
  - engine.yaml
# Pool size; keep the controller Deployment's WORKERS env in sync (kustomize cannot derive it).
replicas:
  - name: s2-worker
    count: 3
