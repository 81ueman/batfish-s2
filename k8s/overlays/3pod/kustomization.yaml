apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  - name: s2-worker
    count: 3
patches:
  - target: {kind: Job, name: s2-controller}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "3"
  - target: {kind: Job, name: s2-verifier}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "3"
  - target: {kind: StatefulSet, name: s2-worker}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "3"
