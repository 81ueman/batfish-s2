apiVersion: batch/v1
kind: Job
metadata:
  name: s2-controller
  namespace: s2
  labels: {app: s2-controller}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app: s2-controller}
    spec:
      restartPolicy: Never
      containers:
        - name: controller
          image: s2:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/s2/entrypoint-controller.sh"]
          env:
            - name: WORKERS
              value: "1"
            - name: NETWORK_NAME
              value: "s2-triangle"
            # The controller is a lightweight coordinator (A7): it parses the snapshot,
            # resolves the partition, ships configs, and collects the workers' results
            # into worker-results-<W>.bin on the shared volume. The vanilla dataplane and
            # the reference BDD analysis now run in the s2-verifier Job, so the
            # controller needs only a small heap (docs/s2-port/OPS.md).
            - name: S2_OUTPUT_DIR
              value: /s2/shared
            # The controller resolves the partition scheme (default WEIGHTED_LPT_FM; append
            # -Ds2.partition=<scheme> to override).
            # Override per run via JAVA_TOOL_OPTIONS.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx1g -Ds2.partition=WEIGHTED_LPT_FM"
          ports:
            - containerPort: 4090
          volumeMounts:
            - name: shared
              mountPath: /s2/shared
          # No longer computes vanilla/reference dataplanes, so it needs a much smaller
          # budget than a worker: 1g heap, 512Mi scheduling floor, 2Gi = 1g heap + ~1Gi
          # non-heap/GC headroom. No CPU limit: it still resolves the partition and
          # serializes/ships the configs.
          resources:
            requests: {memory: "512Mi", cpu: "0.5"}
            limits: {memory: "2Gi"}
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: s2-shared
---
apiVersion: v1
kind: Service
metadata:
  name: s2-controller
  namespace: s2
spec:
  selector: {app: s2-controller}
  ports:
    - port: 4090
      targetPort: 4090
