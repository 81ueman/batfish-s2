apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s2-worker
  namespace: s2
spec:
  serviceName: s2-worker
  replicas: 1
  selector:
    matchLabels: {app: s2-worker}
  template:
    metadata:
      labels: {app: s2-worker}
    spec:
      containers:
        - name: worker
          image: s2:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/s2/entrypoint-worker.sh"]
          env:
            - name: WORKERS
              value: "1"
            - name: NETWORK_NAME
              value: "s2-triangle"
            - name: CONTROLLER_HOST
              value: "s2-controller.s2.svc.cluster.local"
            - name: CONTROLLER_PORT
              value: "4090"
            - name: SIDECAR_PORT
              value: "4091"
            # Default worker heap (docs/s2-port/OPS.md; peaks in M5-SCALE.md).
            # Owned-only dataplane + descriptor shadows are on by default (O1), so the
            # largest verified snapshot (s2-giga) peaks at 1938.1 MiB per worker;
            # -Xmx4g covers that, and the pre-O1 fallback (owned/descriptor off,
            # ~2.5 GiB) with headroom. Override per run via JAVA_TOOL_OPTIONS.
            # The S2 positive-only PrefixSpace memoization is a runner default (pure
            # memoization; the shared-code default stays off so stock Batfish is
            # unaffected), and -Ds2.partition=auto (the controller resolves the scheme;
            # workers receive the assignment). Append -Ds2.prefixSpacePositiveCacheOnly=false
            # or -Ds2.partition=<scheme> to override.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx4g -Ds2.prefixSpacePositiveCacheOnly=true -Ds2.partition=auto"
          ports:
            - containerPort: 4091
            - containerPort: 5091
          # Request is a scheduling floor; the transient peak is absorbed by the limit.
          # 2Gi is above the retained working set (tens of MiB after GC) and near the
          # typical transient; 6Gi = 4g heap + ~2Gi non-heap/GC headroom, which also
          # covers the pre-O1 fallback. No CPU limit: the BDD/symbolic phases burst
          # across cores, so a CFS quota would only throttle them.
          resources:
            requests: {memory: "2Gi", cpu: "1"}
            limits: {memory: "6Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: s2-worker
  namespace: s2
spec:
  clusterIP: None
  selector: {app: s2-worker}
  ports:
    - name: routes
      port: 4091
      targetPort: 4091
    - name: bdd
      port: 5091
      targetPort: 5091
