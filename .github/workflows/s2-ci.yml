name: S2 CI

# Manual-only by design: the S2 unit tests are cheap-ish, but the demo matrix
# (scripts/ci-matrix.sh) launches many full multi-JVM runs and is slow, so this
# workflow never runs on push/PR. Trigger it from the Actions UI (or `gh workflow
# run "S2 CI"`) and tick "run_matrix" to include the demos.
on:
  workflow_dispatch:
    inputs:
      run_matrix:
        description: "Also run the slow demo matrix (scripts/ci-matrix.sh)"
        type: boolean
        default: false
      workers:
        description: "Worker count for the demo matrix"
        type: string
        default: "3"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: "S2 unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bazelisk cache
        uses: actions/cache@v6
        with:
          path: "~/.cache/bazelisk"
          key: ${{runner.os}}-bazelisk-${{ hashFiles('.bazelversion') }}
      - name: Bazel cache
        uses: actions/cache@v6
        with:
          path: "~/.cache/bazel"
          key: ${{runner.os}}-bazel-s2-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'maven_install.json') }}
          restore-keys: |
            ${{runner.os}}-bazel-s2-
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Run S2 unit tests
        run: scripts/ci.sh --tests-only --test-args "--test_output=errors"

  demo-matrix:
    name: "S2 demo matrix"
    if: ${{ inputs.run_matrix }}
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bazelisk cache
        uses: actions/cache@v6
        with:
          path: "~/.cache/bazelisk"
          key: ${{runner.os}}-bazelisk-${{ hashFiles('.bazelversion') }}
      - name: Bazel cache
        uses: actions/cache@v6
        with:
          path: "~/.cache/bazel"
          key: ${{runner.os}}-bazel-s2-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'maven_install.json') }}
          restore-keys: |
            ${{runner.os}}-bazel-s2-
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
      - name: Run S2 demo matrix
        run: scripts/ci.sh --matrix-only --workers "${{ inputs.workers }}"
